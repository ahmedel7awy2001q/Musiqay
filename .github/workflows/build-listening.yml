name: Build Musiqay 1.4.8 verification

on:
  push:
    branches: ["build/v1.4.8-carhub"]
    paths: [".build-request"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        if: ${{ !contains(github.event.head_commit.message, '[ui-only]') }}
        run: ./gradlew --no-daemon -PpreviewBuild=true :app:testDebugUnitTest :app:lintDebug
      - name: Build preview and Android tests
        run: ./gradlew --no-daemon -PpreviewBuild=true :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Build unsigned release package
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect unsigned release tools
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/Musiqay-1.4.8-Release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/Musiqay-1.4.8-Release-unsigned.apk > out/apk-metadata.txt
          grep -q "package: name='com.musiqay.app'" out/apk-metadata.txt
          grep -q "versionCode='12'" out/apk-metadata.txt
          grep -q "versionName='1.4.8'" out/apk-metadata.txt
          sha256sum out/Musiqay-1.4.8-Release-unsigned.apk > out/Musiqay-1.4.8-Release-unsigned.sha256

      - name: Upload build outputs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Musiqay-1.4.8-Unsigned-Release
          path: |
            out/
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/test-results/
          retention-days: 30
          if-no-files-found: error
