name: Build Musiqay 1.4.9 release

on:
  push:
    branches: ["build/v1.4.9-release"]
    paths: [".build-request-149"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Build unsigned release
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Collect and verify unsigned release
        run: |
          mkdir -p out
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          cp "$APK" out/Musiqay-1.4.9-Release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/Musiqay-1.4.9-Release-unsigned.apk > out/apk-metadata.txt
          sha256sum out/Musiqay-1.4.9-Release-unsigned.apk > out/Musiqay-1.4.9-Release-unsigned.sha256
          grep -q "package: name='com.musiqay.app'" out/apk-metadata.txt
          grep -q "versionCode='13'" out/apk-metadata.txt
          grep -q "versionName='1.4.9'" out/apk-metadata.txt
      - name: Upload build outputs and reports
        uses: actions/upload-artifact@v4
        with:
          name: Musiqay-1.4.9-Unsigned-Release
          path: |
            out/
            app/build/reports/
            app/build/test-results/
          retention-days: 30
          if-no-files-found: error
