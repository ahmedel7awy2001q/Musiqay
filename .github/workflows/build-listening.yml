name: Build Musiqay listening preview

on:
  push:
    branches: ["build/v1.4.2-listening"]
    paths: [".build-request"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        if: ${{ !contains(github.event.head_commit.message, '[ui-only]') }}
        run: ./gradlew --no-daemon -PpreviewBuild=true :app:testDebugUnitTest :app:lintDebug
      - name: Build preview
        run: ./gradlew --no-daemon -PpreviewBuild=true :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Collect APK and signing tools
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Musiqay-1.4.2-Listening-Preview-runner.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/Musiqay-1.4.2-Listening-Preview-runner.apk > out/apk-metadata.txt
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Device tests with larger Arabic text
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash .github/scripts/device-tests.sh
      - name: Upload build outputs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Musiqay-1.4.2-Listening-Build
          path: |
            out/
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/test-results/
          retention-days: 30
          if-no-files-found: error
