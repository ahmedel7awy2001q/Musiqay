name: Android CI

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant (release requires the existing signing key)
        type: choice
        required: true
        default: debug
        options: [debug, release]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build debug APK
        if: inputs.variant != 'release'
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build signed release APK
        if: inputs.variant == 'release'
        env:
          MUSIQAY_KEYSTORE_BASE64: ${{ secrets.MUSIQAY_KEYSTORE_BASE64 }}
          MUSIQAY_KEYSTORE_PASSWORD: ${{ secrets.MUSIQAY_KEYSTORE_PASSWORD }}
          MUSIQAY_KEY_ALIAS: ${{ secrets.MUSIQAY_KEY_ALIAS }}
          MUSIQAY_KEY_PASSWORD: ${{ secrets.MUSIQAY_KEY_PASSWORD }}
        run: |
          for key in MUSIQAY_KEYSTORE_BASE64 MUSIQAY_KEYSTORE_PASSWORD MUSIQAY_KEY_ALIAS MUSIQAY_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then echo "Missing release signing secret: $key"; exit 1; fi
          done
          export MUSIQAY_KEYSTORE_PATH="$RUNNER_TEMP/musiqay-release.keystore"
          trap 'rm -f "$MUSIQAY_KEYSTORE_PATH"' EXIT
          printf '%s' "$MUSIQAY_KEYSTORE_BASE64" | base64 --decode > "$MUSIQAY_KEYSTORE_PATH"
          ./gradlew --no-daemon :app:assembleRelease

      - name: Generate SHA-256
        env:
          BUILD_VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          cd "app/build/outputs/apk/${BUILD_VARIANT}"
          sha256sum "app-${BUILD_VARIANT}.apk" > "app-${BUILD_VARIANT}.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Musiqay-${{ inputs.variant || 'debug' }}
          path: |
            app/build/outputs/apk/${{ inputs.variant || 'debug' }}/app-${{ inputs.variant || 'debug' }}.apk
            app/build/outputs/apk/${{ inputs.variant || 'debug' }}/app-${{ inputs.variant || 'debug' }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Package source ZIP
        run: git archive --format=zip --output=Musiqay-source.zip HEAD

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Musiqay-source
          path: Musiqay-source.zip
          if-no-files-found: error
          retention-days: 30

# Publishing a development branch does not trigger a build.
