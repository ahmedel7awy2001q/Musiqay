name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Generate SHA-256
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Musiqay-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Package source ZIP
        run: git archive --format=zip --output=Musiqay-v1.3.0-source.zip HEAD

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Musiqay-source
          path: Musiqay-v1.3.0-source.zip
          if-no-files-found: error
          retention-days: 30

